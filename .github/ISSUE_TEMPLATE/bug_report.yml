name: Bug report
description: Report a reproducible problem in Reframed.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md instead of disclosing details here. Redact personal information from logs and screenshots."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0 or source commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant errors
      description: Remove personal information before posting.
