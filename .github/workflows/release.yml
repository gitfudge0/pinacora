name: Release Pinacora

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Import gitfudge signing identity
        timeout-minutes: 2
        env:
          SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/pinacora-signing.keychain-db"
          keychain_password=$(openssl rand -base64 48)
          echo "::add-mask::$keychain_password"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo 'Importing certificate and private key'
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          echo 'Configuring codesign private key access'
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-certificate -c gitfudge -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          echo 'Trusting certificate for code signing on disposable runner'
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/signing.pem"
          echo 'Verifying signing identity availability'
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain"
      - name: Package macOS app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          BUILD_TARGET: ${{ matrix.target }}
          MACOS_SIGNING_IDENTITY: 8A432625E90DDBE5053D595CBAD2BA712B976643
        run: ./scripts/package-release.sh "$BUILD_TARGET" "$RELEASE_TAG"
      - name: Verify gitfudge certificate fingerprint
        run: |
          set -euo pipefail
          codesign --display --extract-certificates="$RUNNER_TEMP/app-signing-" dist/Pinacora.app
          fingerprint=$(openssl x509 -inform DER -in "$RUNNER_TEMP/app-signing-0" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          test "$fingerprint" = 8A432625E90DDBE5053D595CBAD2BA712B976643
      - name: Remove temporary signing keychain
        if: always()
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          cert = pathlib.Path(os.environ["RUNNER_TEMP"]) / "signing.pem"
          if cert.exists():
              try:
                  subprocess.run(["sudo", "-n", "security", "remove-trusted-cert", "-d", str(cert)], timeout=20, check=False)
              except subprocess.TimeoutExpired:
                  print("Trust cleanup timed out on disposable runner")
          PY
          security delete-keychain "$RUNNER_TEMP/pinacora-signing.keychain-db" || true
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          for pattern in ("signing.p12", "signing.pem", "app-signing-*"):
              for path in root.glob(pattern):
                  path.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxcb-xkb-dev libssl-dev libvulkan-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Package Linux app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: ./scripts/package-linux-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          cd release-assets
          sha256sum --check *.sha256
          gh release upload "$RELEASE_TAG" ./* --clobber
