[package]
name = "pinacora"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
plist = "1"
tempfile = "3"
unicode-segmentation = "1"
async-channel = "2"
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSScreen", "NSApplication", "NSImage", "NSResponder", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSAccessibility", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL", "NSDictionary", "NSArray", "NSError", "NSData", "NSGeometry", "NSObject"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
